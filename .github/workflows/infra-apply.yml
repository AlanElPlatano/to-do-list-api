name: Infra - Apply

on:
  workflow_dispatch:

concurrency: terraform

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: terraform apply
        run: terraform apply -auto-approve -input=false

      # GITHUB_TOKEN no puede escribir secrets, por eso se usa un PAT
      - name: Guardar IP y llave SSH de la EC2 en GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          terraform output -raw server_public_ip | gh secret set EC2_HOST
          terraform output -raw private_key_pem | gh secret set EC2_SSH_KEY

      - name: Esperar a que la API responda
        run: |
          IP=$(terraform output -raw server_public_ip)
          for i in $(seq 1 60); do
            if VERSION=$(curl -fs "http://$IP:8000/version"); then
              echo "API lista: $VERSION"
              echo "API desplegada en http://$IP:8000 ($VERSION)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::La API no respondió después de 10 minutos"
          exit 1

name: CI

on:
  pull_request:
    branches: [main]
  # Lo reutiliza el workflow de release para no publicar versiones con pruebas rotas
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

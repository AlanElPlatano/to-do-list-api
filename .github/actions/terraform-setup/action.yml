name: Terraform setup
description: Configura las credenciales de AWS, crea el bucket del state si hace falta y corre terraform init

inputs:
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-session-token:
    required: true

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-session-token: ${{ inputs.aws-session-token }}
        aws-region: us-east-1

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.6
        # Sin el wrapper, `terraform output -raw` devuelve solo el valor
        terraform_wrapper: false

    # El nombre incluye el ID de la cuenta para que sea único en S3
    - name: Crear el bucket del state si no existe
      shell: bash
      run: |
        BUCKET="todo-api-tfstate-$(aws sts get-caller-identity --query Account --output text)"
        if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
          aws s3api create-bucket --bucket "$BUCKET"
          aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
        fi
        echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

    - name: terraform init
      shell: bash
      working-directory: terraform
      run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
